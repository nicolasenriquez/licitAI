<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc"><title id="title">Información técnica colapsada</title><desc id="desc">Disclosure técnico secundario con payload sanitizado.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:20px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#666}.box{fill:#fff;stroke:#aaa}.soft{fill:#eee;stroke:#bbb}.mono{font-family:monospace;font-size:12px}</style><rect width="640" height="700" fill="#fafafa"/><text class="h" x="30" y="50">Detalle del proceso</text><text class="m" x="30" y="92">Resumen　 Ítems y ofertas　 Documentos</text><rect class="box" x="30" y="130" width="580" height="62"/><text class="m" x="48" y="168">Información técnica　⌄</text><text class="s" x="30" y="222">Cerrado por defecto. Se carga solo al abrir.</text><rect class="soft" x="30" y="258" width="580" height="310"/><text class="m" x="48" y="292">Información técnica　⌃</text><text class="m" x="48" y="328">Procedencia</text><text class="s" x="48" y="356">Los identificadores internos quedan dentro de este bloque.</text><rect class="box" x="48" y="382" width="210" height="40"/><text class="m" x="66" y="407">Ver JSON sanitizado</text><rect class="box" x="270" y="382" width="220" height="40"/><text class="m" x="288" y="407">Copiar JSON sanitizado</text><text class="mono" x="48" y="462">{ "codigo": "1234-5-LE26", … }</text><text class="s" x="48" y="536">No mostrar fresh, available ni UUID en el resumen.</text></svg>
