<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc"><title id="title">Error de lista con filtros preservados</title><desc id="desc">Un solo Callout de error y filtros visibles.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:22px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#666}.box{fill:#fff;stroke:#aaa}.soft{fill:#eee;stroke:#bbb}.err{fill:#fff1f0;stroke:#b94a48}.note{fill:#fff7d6;stroke:#b79528}</style><rect width="1280" height="680" fill="#fafafa"/><text class="h" x="50" y="48">Procesos</text><rect class="box" x="50" y="82" width="280" height="44"/><text class="m" x="66" y="109">mantención</text><rect class="box" x="342" y="82" width="150" height="44"/><text class="m" x="358" y="109">Publicada</text><rect class="box" x="504" y="82" width="150" height="44"/><text class="m" x="520" y="109">Región 13</text><rect class="err" x="50" y="164" width="900" height="112"/><text class="h" x="74" y="202">No fue posible cargar los procesos</text><text class="m" x="74" y="230">Tus filtros se conservaron. Reintenta o ajusta la búsqueda.</text><rect class="box" x="790" y="196" width="130" height="44"/><text class="m" x="816" y="224">Reintentar</text><rect class="note" x="982" y="164" width="250" height="112"/><text class="m" x="1000" y="198">Un solo Callout</text><text class="s" x="1000" y="226">role="alert"</text><text class="s" x="1000" y="250">Misma URL y variables</text></svg>
