<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Error de detalle con reintento local</title><desc id="desc">La lista permanece visible y el panel recupera el detalle sin cerrarse.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:20px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#666}.box{fill:#fff;stroke:#aaa}.soft{fill:#eee;stroke:#bbb}.err{fill:#fff1f0;stroke:#b94a48}.note{fill:#fff7d6;stroke:#b79528}</style><rect width="1280" height="720" fill="#fafafa"/><rect class="box" x="24" y="50" width="780" height="640"/><text class="h" x="48" y="88">Procesos</text><rect class="soft" x="48" y="120" width="732" height="48"/><text class="m" x="64" y="150">Proceso　　　　Comprador　　　　Cierre</text><text class="s" x="64" y="206">Mantención de equipos · Municipalidad · 28/08/2026</text><rect class="box" x="816" y="50" width="440" height="640"/><text class="h" x="840" y="88">Mantención de equipos</text><text class="s" x="840" y="112">1234-5-LE26</text><rect class="err" x="840" y="154" width="392" height="150"/><text class="h" x="864" y="192">Detalle no disponible</text><text class="m" x="864" y="220">El proceso sigue seleccionado.</text><rect class="box" x="864" y="242" width="124" height="42"/><text class="m" x="890" y="268">Reintentar</text><rect class="note" x="840" y="348" width="392" height="92"/><text class="m" x="860" y="378">Reintento local</text><text class="s" x="860" y="404">Conserva código, URL, filtros y scroll.</text><text class="s" x="860" y="426">No obliga a cerrar el panel.</text></svg>
