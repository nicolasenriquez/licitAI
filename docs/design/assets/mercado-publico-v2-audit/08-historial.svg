<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Historial dentro del contexto</title><desc id="desc">Subvista con título, código, retorno y estados con y sin cambios.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:20px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#666}.box{fill:#fff;stroke:#aaa}.soft{fill:#eee;stroke:#bbb}</style><rect width="720" height="760" fill="#fafafa"/><text class="m" x="30" y="42">← Volver al detalle</text><text class="h" x="30" y="82">Mantención de equipos</text><text class="s" x="30" y="106">1234-5-LE26 · Historial</text><rect class="soft" x="30" y="138" width="660" height="94"/><text class="m" x="48" y="170">Qué se registra aquí</text><text class="s" x="48" y="198">Cambios observados en estado, cierre, monto y evidencia de la fuente.</text><rect class="box" x="30" y="264" width="660" height="104"/><text class="m" x="48" y="298">26/08/2026 · 10:14</text><text class="s" x="48" y="326">Cierre: 27/08/2026 → 28/08/2026</text><text class="s" x="48" y="350">Origen: nueva observación de Mercado Público</text><rect class="box" x="30" y="408" width="660" height="118"/><text class="m" x="48" y="442">Estado sin cambios</text><text class="s" x="48" y="470">Aún no hay cambios observados para este proceso.</text><text class="s" x="48" y="494">Vuelve al detalle para revisar la evidencia actual.</text></svg>
