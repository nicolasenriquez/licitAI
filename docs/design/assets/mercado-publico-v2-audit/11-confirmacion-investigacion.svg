<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" aria-labelledby="title desc"><title id="title">Confirmación de Marcar para investigar</title><desc id="desc">Estados inicial, pendiente, éxito y error de la acción CRM.</desc><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:20px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#666}.box{fill:#fff;stroke:#aaa}.soft{fill:#eee;stroke:#bbb}.ok{fill:#edf8ef;stroke:#4c8b57}.err{fill:#fff1f0;stroke:#b94a48}</style><rect width="680" height="720" fill="#fafafa"/><text class="h" x="30" y="48">Investigación CRM</text><text class="m" x="30" y="88">Estado inicial</text><rect x="30" y="104" width="220" height="46" fill="#333"/><text class="m" x="52" y="133" fill="#fff">Marcar para investigar</text><text class="m" x="30" y="198">Pendiente</text><rect class="soft" x="30" y="214" width="250" height="46"/><text class="m" x="52" y="243">Marcando para investigar…</text><text class="m" x="30" y="308">Éxito: nuevo o existente</text><rect class="ok" x="30" y="326" width="600" height="112"/><text class="h" x="52" y="362">En investigación</text><text class="s" x="52" y="388">La acción es idempotente por workspace + código.</text><rect class="box" x="454" y="350" width="150" height="44"/><text class="m" x="474" y="378">Abrir en CRM</text><text class="m" x="30" y="490">Error</text><rect class="err" x="30" y="508" width="600" height="112"/><text class="m" x="52" y="544">No fue posible marcar este proceso. El detalle se conservó.</text><rect class="box" x="476" y="550" width="128" height="44"/><text class="m" x="500" y="578">Reintentar</text></svg>
